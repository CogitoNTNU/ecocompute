name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecocompute-terraform
  cancel-in-progress: false

jobs:
  checks:
    name: Required application checks
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_INPUT: "false"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TF_VAR_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
      TF_VAR_azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      TF_VAR_entra_tenant_id: ${{ vars.ENTRA_TENANT_ID }}
      TF_VAR_entra_client_id: ${{ vars.ENTRA_CLIENT_ID }}
      TF_VAR_entra_allowed_group_id: ${{ vars.ENTRA_ALLOWED_GROUP_ID }}
      TF_VAR_rollout_ip_cidr: ${{ vars.ALLOWED_IP_CIDR }}
      TF_VAR_image_tag: ${{ github.sha }}

    defaults:
      run:
        working-directory: infra/terraform/azure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TF_VAR_TENANT_ID }}
          subscription-id: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.4"
          terraform_wrapper: false

      - name: Validate Terraform
        run: |
          terraform init
          terraform fmt -check -recursive
          terraform validate

      - name: Create registry
        run: terraform apply -auto-approve -target=azurerm_container_registry.main

      - name: Build image
        run: |
          registry=$(terraform output -raw registry_name)
          az acr build \
            --registry "$registry" \
            --image "ecocompute:$TF_VAR_image_tag" \
            --file "$GITHUB_WORKSPACE/backend/Dockerfile" \
            "$GITHUB_WORKSPACE"

      - name: Stage sign-in behind existing IP restriction
        run: |
          restricted=0
          state_resources=$(terraform state list)
          if grep -q '^azurerm_container_app.main' <<< "$state_resources"; then
            group=$(terraform output -raw resource_group_name)
            for app in ecocompute-always-on ecocompute-autoscale; do
              rule_count=$(az containerapp ingress access-restriction list \
                --resource-group "$group" --name "$app" --query 'length(@)' -o tsv)
              if [ "$rule_count" != "0" ]; then restricted=1; fi
            done
          fi
          if [ "$restricted" = "1" ]; then
            terraform apply -auto-approve -var='public_ingress=false'
          fi

      - name: Plan deployment
        run: terraform plan -out=deploy.tfplan

      - name: Deploy
        run: terraform apply deploy.tfplan

      - name: Show app URLs
        run: terraform output app_urls
